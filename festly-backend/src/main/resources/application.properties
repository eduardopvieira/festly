spring.application.name=festly

# Server
server.port=${PORT:8080}

# Datasource
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/festly}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:pedro}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
jwt.secret=${JWT_SECRET:ZmVzdGx5LXN1cGVyLXNlY3JldC1rZXktZm9yLWp3dC10b2tlbnMtMjAyNg==}
jwt.expiration=604800000

# Mail (Mailtrap)
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:3d9a3f536153d5}
spring.mail.password=${MAIL_PASSWORD:6bdde7e3f1e14b}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Payment
payment.provider=${PAYMENT_PROVIDER:fake}

# Asaas
asaas.api-url=https://api-sandbox.asaas.com/v3
asaas.api-key=${ASAAS_API_KEY:}
asaas.webhook-token=${ASAAS_WEBHOOK_TOKEN:dev}
asaas.pix-expiration-minutes=30

# CORS (separe múltiplas origens por vírgula)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}